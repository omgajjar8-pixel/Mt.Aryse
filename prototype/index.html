<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mt. Aryse</title>
<meta name="description" content="Your trek mate, even with no network. Early prototype for testing.">
<meta name="theme-color" content="#1E4D40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mt. Aryse">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;700&display=swap">
<style>/* Mt. Aryse prototype. One full-screen phone app, no frames. */

:root {
  --forest: #1E4D40;
  --forest-deep: #133A30;
  --forest-mid: #2E6656;
  --forest-tint: #E6F0EB;
  --amber: #E8A33D;
  --amber-ink: #2A1A02;
  --amber-tint: #FBF1DE;
  --amber-line: #EED9AE;
  --amber-text: #7A4E0E;
  --bg: #F4F6F3;
  --surface: #FFFFFF;
  --ink: #15302A;
  --muted: #536B65;
  --faint: #8A9C97;
  --line: #E0E7E3;
  --line-strong: #C9D5D0;
  --water: #21639A;
  --water-tint: #E3EEF8;
  --ok: #2F8A5B;
  --ok-tint: #DCEFE4;
  --ok-text: #1F5C3E;
  --danger: #B3261E;
  --danger-tint: #FBE7E5;

  --font-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;

  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 22px;
  --pad: 20px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); }
body {
  font-family: var(--font-body);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

/* App frame: full-bleed on phones, a phone-width column on big screens */
#app {
  position: relative;
  height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
  overflow: hidden;
  background: var(--bg);
}
@media (min-width: 600px) {
  html, body { background: #DDE5E1; }
  #app { height: min(100dvh, 920px); top: max(0px, calc((100dvh - 920px) / 2)); border-radius: 28px; box-shadow: 0 20px 60px rgba(19, 58, 48, .18); }
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
.screen.dark { background: var(--forest); color: #fff; }
.scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  scrollbar-width: none;
}
.scroll::-webkit-scrollbar, .sheet-body::-webkit-scrollbar { display: none; }
.pad { padding-left: var(--pad); padding-right: var(--pad); }
.top-safe { padding-top: calc(var(--safe-top) + 12px); }

/* Screen transitions */
.enter-push { animation: push-in .32s var(--ease) both; }
.enter-pop { animation: pop-in .32s var(--ease) both; }
.enter-fade { animation: fade-in .2s ease-out both; }
@keyframes push-in { from { transform: translateX(28%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop-in { from { transform: translateX(-20%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* Type */
.display { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.015em; line-height: 1.05; }
.h1 { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.08; letter-spacing: -0.015em; }
.h2 { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.2; letter-spacing: -0.01em; }
.h3 { font-size: 17px; font-weight: 700; line-height: 1.3; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.lede { font-size: 17px; line-height: 1.5; color: var(--muted); }

/* App bar */
.appbar {
  display: flex; align-items: center; gap: 8px;
  padding: calc(var(--safe-top) + 8px) 12px 8px;
  min-height: calc(var(--safe-top) + 60px);
  background: var(--bg);
  position: relative; z-index: 2;
}
.appbar.over { position: absolute; left: 0; right: 0; top: 0; background: transparent; }
.appbar .title { flex: 1; font-weight: 700; font-size: 17px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar .spacer { width: 44px; flex-shrink: 0; }
.icon-btn {
  width: 44px; height: 44px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 22px;
  transition: background .15s, transform .1s;
}
.icon-btn:active { transform: scale(.94); background: rgba(21, 48, 42, .08); }
.icon-btn.solid { background: var(--surface); box-shadow: 0 1px 2px rgba(21, 48, 42, .12), 0 0 0 1px var(--line); }
.icon-btn.glass { background: rgba(255, 255, 255, .88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 1px 3px rgba(21, 48, 42, .15); }
.icon { width: 24px; height: 24px; flex-shrink: 0; }
.icon.sm { width: 18px; height: 18px; }
.icon.lg { width: 28px; height: 28px; }

/* Buttons */
.btn {
  min-height: 56px; padding: 0 22px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  border-radius: var(--r-md);
  font-size: 17px; font-weight: 700;
  transition: transform .1s, filter .15s, background .15s;
  text-decoration: none; user-select: none; -webkit-user-select: none;
}
.btn:active { transform: scale(.98); filter: brightness(.95); }
.btn.block { width: 100%; }
.btn.primary { background: var(--forest); color: #fff; }
.btn.amber { background: var(--amber); color: var(--amber-ink); }
.btn.secondary { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn.ghost { color: var(--forest); min-height: 48px; }
.btn.ghost-light { color: #CFE3DA; min-height: 48px; font-weight: 700; }
.btn.danger { background: var(--danger); color: #fff; }
.btn.sm { min-height: 44px; font-size: 15px; padding: 0 16px; border-radius: var(--r-sm); }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* Sticky footer for primary actions */
.footer {
  padding: 12px var(--pad) calc(var(--safe-bottom) + 16px);
  background: linear-gradient(to bottom, rgba(244, 246, 243, 0), var(--bg) 22%);
  display: flex; flex-direction: column; gap: 6px;
  position: relative; z-index: 2;
}
.dark .footer { background: none; }
.footer .note { display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; font-size: 14px; color: var(--muted); }
.dark .footer .note { color: #BFD8CE; }

/* Cards and lists */
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: 0 0 0 1px var(--line); }
.card.pad16 { padding: 16px; }
.section { padding: 28px var(--pad) 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; min-height: 64px; width: 100%; text-align: left;
  transition: background .15s;
}
button.row:active, a.row:active { background: #F0F4F2; }
.list { background: var(--surface); border-radius: var(--r-lg); box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.list > * + * { border-top: 1px solid var(--line); }
.row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row .t { font-weight: 700; font-size: 16px; }
.row .s { font-size: 14px; color: var(--muted); }
.chev { color: var(--faint); }
.tile {
  width: 44px; height: 44px; border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  background: var(--forest-tint); color: var(--forest);
}
.tile.water { background: var(--water-tint); color: var(--water); }
.tile.amber { background: #F5E0B5; color: #8A5A10; }
.tile.danger { background: var(--danger-tint); color: var(--danger); }
.tile.ok { background: var(--ok-tint); color: var(--ok-text); }

/* Chips */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px;
  font-size: 14px; font-weight: 700; white-space: nowrap;
}
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.chip.open { background: var(--ok-tint); color: var(--ok-text); }
.chip.rules { background: var(--amber-tint); color: var(--amber-text); }
.chip.closed { background: #ECEFEE; color: #5B6B67; }
.chip.on-dark { background: rgba(255, 255, 255, .16); color: #fff; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px var(--pad); margin: 0 calc(var(--pad) * -1); }
.chips::-webkit-scrollbar { display: none; }
.filter {
  padding: 9px 16px; border-radius: 999px; font-size: 15px; font-weight: 700;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); white-space: nowrap;
  transition: background .15s, color .15s;
}
.filter[aria-pressed="true"] { background: var(--forest); color: #fff; box-shadow: none; }

/* Tab bar */
.tabbar {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  background: rgba(255, 255, 255, .96);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  padding: 6px 6px calc(var(--safe-bottom) + 6px);
  position: relative; z-index: 3;
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 2px; font-size: 12px; font-weight: 700; color: var(--faint);
  border-radius: 12px; transition: color .15s;
}
.tab .pill { width: 56px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; transition: background .2s; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] .pill { background: var(--forest-tint); color: var(--forest); }

/* Onboarding */
.onb-illus { width: calc(100% + var(--pad) * 2); margin: 4px calc(var(--pad) * -1) 0; height: auto; display: block; }
.step-dots { display: flex; gap: 6px; }
.step-dots span { width: 22px; height: 4px; border-radius: 2px; background: var(--line-strong); }
.step-dots span.on { background: var(--forest); }
.choice {
  display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;
  padding: 18px; border-radius: var(--r-lg); background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--line);
  transition: box-shadow .15s, background .15s, transform .1s;
}
.choice:active { transform: scale(.99); }
.choice[aria-checked="true"] { box-shadow: inset 0 0 0 2px var(--forest); background: var(--forest-tint); }
.radio { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line-strong); flex-shrink: 0; transition: box-shadow .15s; }
[aria-checked="true"] > .radio { box-shadow: inset 0 0 0 7px var(--forest); }
.check-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
.check-list li { display: flex; gap: 12px; align-items: flex-start; font-size: 16px; }
.check-list .tick { width: 26px; height: 26px; border-radius: 13px; background: var(--ok-tint); color: var(--ok-text); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* Explore */
.search {
  display: flex; align-items: center; gap: 10px;
  height: 52px; padding: 0 16px; border-radius: var(--r-md);
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--muted);
}
.search input { border: 0; outline: 0; background: none; flex: 1; font-size: 17px; min-width: 0; color: var(--ink); }
.carousel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 var(--pad); scrollbar-width: none; padding: 2px var(--pad) 4px; margin: 0 calc(var(--pad) * -1); }
.carousel::-webkit-scrollbar { display: none; }
.trek-card {
  flex: 0 0 78%; scroll-snap-align: start; text-align: left;
  background: var(--surface); border-radius: var(--r-lg); overflow: hidden;
  box-shadow: 0 0 0 1px var(--line); transition: transform .12s;
}
.trek-card:active { transform: scale(.985); }
.trek-card .art { display: block; width: 100%; height: 150px; overflow: hidden; }
.trek-card .art svg { display: block; width: 100%; height: 100%; }
.trek-card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
.trek-card .name { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.1; }
.facts-line { font-size: 14px; color: var(--muted); }
.trek-row .art { width: 64px; height: 64px; border-radius: 14px; overflow: hidden; flex-shrink: 0; }
.trek-row .art svg { display: block; width: 100%; height: 100%; }

/* Trek page */
.hero { position: relative; }
.hero svg { display: block; width: 100%; height: auto; }
.hero .chip { position: absolute; left: var(--pad); bottom: 16px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-radius: var(--r-lg); overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.facts > div { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.facts .k { font-size: 13px; color: var(--muted); }
.facts .v { font-size: 17px; font-weight: 700; }
.months { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.month {
  padding: 10px 4px; border-radius: var(--r-sm); text-align: center;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
  display: flex; flex-direction: column; gap: 2px;
}
.month b { font-size: 15px; }
.month span { font-size: 11.5px; color: var(--muted); }
.month[aria-pressed="true"] { background: var(--forest); color: #fff; box-shadow: none; }
.month[aria-pressed="true"] span { color: #CFE3DA; }
.callout { padding: 14px 16px; border-radius: var(--r-md); background: var(--forest-tint); font-size: 15.5px; line-height: 1.5; }
.callout.amber { background: var(--amber-tint); box-shadow: inset 0 0 0 1px var(--amber-line); }
.daylist { position: relative; }
.day { display: flex; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; align-items: flex-start; }
.day .num {
  width: 32px; height: 32px; border-radius: 16px; flex-shrink: 0;
  background: var(--forest-tint); color: var(--forest); font-weight: 700; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
}
.day .more { font-size: 15px; color: var(--ink); margin-top: 8px; line-height: 1.5; display: none; }
.day[aria-expanded="true"] .more { display: block; }
.day .chev { transition: transform .2s; margin-top: 4px; }
.day[aria-expanded="true"] .chev { transform: rotate(90deg); }
.peaks { display: flex; flex-wrap: wrap; gap: 8px; }
.peak-chip { padding: 8px 14px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); font-size: 15px; font-weight: 700; }
.bullets { padding: 0; margin: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
.bullets li { display: flex; gap: 12px; font-size: 15.5px; line-height: 1.5; }
.bullets li::before { content: ""; width: 6px; height: 6px; border-radius: 3px; background: var(--amber); margin-top: 9px; flex-shrink: 0; }
.report { padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.report .who { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.avatar { width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #fff; flex-shrink: 0; }
.source { font-size: 13px; color: var(--muted); }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r-md); background: var(--amber-tint); box-shadow: inset 0 0 0 1px var(--amber-line); font-size: 15px; }

/* Progress */
.progress { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--forest); border-radius: 4px; transition: width .3s var(--ease); }
.btn .progress { width: 100%; background: rgba(255, 255, 255, .25); }
.btn .progress > i { background: #fff; }
.ring { position: relative; width: 76px; height: 76px; flex-shrink: 0; }
.ring svg { transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }

/* Checklist rows */
.check {
  width: 28px; height: 28px; border-radius: 14px; flex-shrink: 0;
  box-shadow: inset 0 0 0 2px var(--line-strong);
  display: flex; align-items: center; justify-content: center; color: transparent;
  transition: background .15s, box-shadow .15s;
}
.check.on { background: var(--ok); box-shadow: none; color: #fff; }

/* On trail */
.trail-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(var(--safe-top) + 12px) var(--pad) 4px; }
.status-line { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ok-text); }
.status-line .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--ok); }
.now-main { padding: 18px var(--pad) 8px; display: flex; flex-direction: column; gap: 4px; }
.now-name { font-family: var(--font-display); font-weight: 700; font-size: 54px; line-height: 1; letter-spacing: -0.02em; }
.now-time { font-family: var(--font-display); font-weight: 500; font-size: 32px; line-height: 1.15; }
.now-time b { font-weight: 700; }
.on-trail {
  margin-top: 14px; align-self: flex-start;
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px 9px 12px;
  border-radius: 999px; background: var(--ok-tint); color: var(--ok-text); font-size: 15px; font-weight: 700;
}
.on-trail .pulse { width: 10px; height: 10px; border-radius: 5px; background: var(--ok); box-shadow: 0 0 0 0 rgba(47, 138, 91, .5); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(47, 138, 91, 0); } 100% { box-shadow: 0 0 0 0 rgba(47, 138, 91, 0); } }
.drift {
  margin: 14px var(--pad) 0; padding: 16px; border-radius: var(--r-lg);
  background: var(--amber-tint); box-shadow: inset 0 0 0 1px var(--amber-line);
  display: flex; flex-direction: column; gap: 12px; animation: fade-in .25s;
}
.drift .arrow { width: 52px; height: 52px; border-radius: 26px; background: var(--amber); color: var(--amber-ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.helper { font-size: 14px; color: var(--muted); padding: 8px 12px; background: rgba(30, 77, 64, .06); border-radius: 10px; margin-top: 8px; display: flex; gap: 8px; align-items: flex-start; }
.heads { padding: 14px var(--pad) 0; display: flex; flex-direction: column; gap: 10px; }
.head-card { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: var(--r-lg); background: var(--surface); box-shadow: 0 0 0 1px var(--line); text-align: left; width: 100%; }
.head-card.warn { background: var(--amber-tint); box-shadow: inset 0 0 0 1px var(--amber-line); }
.head-card .t { font-size: 17px; font-weight: 700; }
.head-card .s { font-size: 14.5px; color: var(--muted); }
.head-card.warn .s { color: #6B4E1C; }
.profile { padding: 18px var(--pad) 0; }
.profile .ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.profile svg { display: block; width: 100%; height: 64px; }
.quick { display: flex; gap: 10px; padding: 16px var(--pad) 12px; }
.quick .btn { min-height: 54px; font-size: 16px; padding: 0 16px; }

/* Map */
.map-wrap { position: relative; flex: 1; overflow: hidden; background: #E9EEE4; touch-action: none; }
.map-wrap > svg { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; }
.map-top { position: absolute; left: 0; right: 0; top: 0; padding: calc(var(--safe-top) + 12px) 16px 0; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.map-top > * { pointer-events: auto; }
.layer-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.layer-chips::-webkit-scrollbar { display: none; }
.layer {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px;

const STORE = "mtaryse-proto-v1";
const DEFAULT_STATE = {
  onboarded: false, installSeen: false, experience: null, location: null,
  downloaded: {}, checks: {}, packing: {}, contacts: [], notes: [],
  offTrail: false, trailTipsSeen: false, units: "ft", batterySaver: false,
  diy: null, visited: [], feedbackAsked: false,
};
let S = load();
function load() {
  try { return Object.assign({}, DEFAULT_STATE, JSON.parse(localStorage.getItem(STORE) || "{}")); }
  catch (e) { return Object.assign({}, DEFAULT_STATE); }
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }
function set(patch) { Object.assign(S, patch); save(); }

let svgUid = 0;
// Layered ridges drawn from a seed, so every trek gets its own landscape without photos.
function art(trek, w = 400, h = 220) {
  const a = trek.art, id = "a" + (++svgUid);
  let seed = a.seed * 9301 + 49297;
  const rand = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  const ridge = (base, amp, rough) => {
    const n = 64, ys = new Array(n + 1);
    ys[0] = rand() * 0.5; ys[n] = rand() * 0.5;
    for (let step = n, k = 0.6; step > 1; step /= 2, k *= rough) {
      for (let i = step / 2; i < n; i += step) ys[i] = (ys[i - step / 2] + ys[i + step / 2]) / 2 + (rand() - 0.4) * k;
    }
    const lo = Math.min(...ys), hi = Math.max(...ys);
    let d = `M0 ${h}`;
    ys.forEach((v, i) => { d += ` L${((i / n) * w).toFixed(1)} ${(base - ((v - lo) / (hi - lo || 1)) * amp).toFixed(1)}`; });
    return d + ` L${w} ${h} Z`;
  };
  const layers = [
    { base: h * 0.66, amp: h * 0.5, n: 0.62 },
    { base: h * 0.76, amp: h * 0.3, n: 0.55 },
    { base: h * 0.88, amp: h * 0.24, n: 0.5 },
    { base: h * 1.0, amp: h * 0.14, n: 0.45 },
  ];
  const far = ridge(layers[0].base, layers[0].amp, layers[0].n);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a.sky[0]}"/><stop offset="1" stop-color="${a.sky[1]}"/></linearGradient>
    <clipPath id="${id}c"><rect width="${w}" height="${h * 0.3}"/></clipPath>
    <linearGradient id="${id}h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/></linearGradient></defs>
    <rect width="${w}" height="${h}" fill="url(#${id}s)"/>
    <circle cx="${w * 0.78}" cy="${h * 0.22}" r="${h * 0.07}" fill="#fff" opacity=".7"/>
    <path d="${far}" fill="${a.ridges[0]}"/>
    <path d="${far}" fill="#fff" opacity=".92" clip-path="url(#${id}c)"/>
    <rect y="${h * 0.3}" width="${w}" height="${h * 0.4}" fill="url(#${id}h)"/>
    ${layers.slice(1).map((l, i) => `<path d="${ridge(l.base, l.amp, l.n)}" fill="${a.ridges[i + 1]}"/>`).join("")}
  </svg>`;
}

function toast(msg, ic = "check") {

let sheetCleanup = null;
function sheet(html, mount) {
  closeSheet(true);
  const bd = document.createElement("div"); bd.className = "backdrop"; bd.dataset.act = "close-sheet";
  const sh = document.createElement("div"); sh.className = "sheet"; sh.setAttribute("role", "dialog"); sh.setAttribute("aria-modal", "true");
  sh.innerHTML = `<div class="grab" aria-hidden="true"></div><div class="sheet-body">${html}</div>`;
  $app.append(bd, sh);
  // Drag the handle down to close.
  let y0 = null;
  sh.addEventListener("touchstart", (e) => { if (sh.querySelector(".sheet-body").scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive: true });
  sh.addEventListener("touchmove", (e) => { if (y0 == null) return; const dy = e.touches[0].clientY - y0; if (dy > 0) sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
  sh.addEventListener("touchend", (e) => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null; if (dy > 90) closeSheet(); else sh.style.transform = ""; });
  sheetCleanup = mount ? mount(sh) : null;
  const first = sh.querySelector("input, textarea, button:not(.grab)");
  if (first && first.tagName !== "BUTTON") setTimeout(() => first.focus(), 300);
  return sh;
}
function closeSheet(instant) {
  const sh = $app.querySelector(".sheet"), bd = $app.querySelector(".backdrop");
  if (!sh) return;
  if (typeof sheetCleanup === "function") sheetCleanup();
  sheetCleanup = null;
  if (instant) { sh.remove(); bd && bd.remove(); return; }
  sh.classList.add("closing"); bd && bd.classList.add("closing");
  setTimeout(() => { sh.remove(); bd && bd.remove(); }, 220);
}

/* ---------- router ---------- */

const ONBOARDING = ["install", "welcome", "experience", "location"];
const TABS = ["explore", "mytreks", "tools", "me"];
const DEPTH = { install: 0, welcome: 1, experience: 2, location: 3, explore: 5, mytreks: 5, tools: 5, me: 5, trek: 10, prepare: 11, trail: 20, "diy-start": 25, "diy-roles": 26, look: 12, ams: 30, sos: 30 };
let stack = [];
let current = null;
let pendingReplace = false;
const scrollMemory = {};

function parse(hash) {
  const parts = hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  return { name: parts[0] || "", params: parts.slice(1), key: parts.join("/") };
}

function go(route, { replace = false } = {}) {
  const hash = "#/" + route;
  if (location.hash === hash) return;
  pendingReplace = replace;
  if (replace) location.replace(hash); else location.hash = hash;
}

function homeRoute() {
  if (!S.onboarded) return isStandalone() || S.installSeen ? "welcome" : "install";
  return "explore";
}

function render() {
  let r = parse(location.hash);
  if (!VIEWS[r.name]) { go(homeRoute(), { replace: true }); return; }
  if (!S.onboarded && !ONBOARDING.includes(r.name)) { go(homeRoute(), { replace: true }); return; }

  // Direction: popping back to the previous entry, or pushing a new one.
  let dir = "push";
  const at = stack.lastIndexOf(r.key);
  if (pendingReplace && stack.length) { stack[stack.length - 1] = r.key; }
  else if (at >= 0 && at < stack.length - 1) { stack = stack.slice(0, at + 1); dir = "pop"; }
  else if (at < 0) stack.push(r.key);
  pendingReplace = false;
  if (stack.length > 40) stack = stack.slice(-40);

  const prev = current;
  if (prev) { const sc = $app.querySelector(".screen .scroll"); if (sc) scrollMemory[prev.key] = sc.scrollTop; }
  const same = prev && prev.key === r.key;
  const sameLevel = prev && ((TABS.includes(prev.name) && TABS.includes(r.name)) || (prev.name === "trail" && r.name === "trail"));
  if (prev && !sameLevel) dir = DEPTH[r.name] < DEPTH[prev.name] ? "pop" : dir;

  const view = VIEWS[r.name](...r.params);
  closeSheet(true);
  const el = document.createElement("div");
  el.className = `screen ${view.cls || ""} ${same ? "" : !prev || sameLevel ? "enter-fade" : dir === "pop" ? "enter-pop" : "enter-push"}`;
  el.innerHTML = view.html;
  $app.querySelectorAll(".screen").forEach((s) => s.remove());
  $app.appendChild(el);
  current = r;

  const theme = view.theme || (view.cls && view.cls.includes("dark") ? "#1E4D40" : "#F4F6F3");
  document.querySelector('meta[name="theme-color"]').setAttribute("content", theme);
  document.documentElement.style.background = theme;
  document.title = view.title ? `${view.title} · Mt. Aryse` : "Mt. Aryse";

  const sc = el.querySelector(".scroll");
  if (sc && (same || dir === "pop") && scrollMemory[r.key]) sc.scrollTop = scrollMemory[r.key];
  if (!S.visited.includes(r.name)) { S.visited.push(r.name); save(); }
  if (view.mount) view.mount(el);
}

const ring = (pct, size = 76, stroke = 8) => {

};

// Trail for Day 3 in map units (800 × 1000), drawn as a smooth curve.
const MAP_PTS = [[170, 920], [220, 860], [255, 800], [245, 735], [300, 680], [365, 650], [385, 590], [352, 530], [404, 478], [474, 450], [505, 388], [482, 326], [534, 266], [592, 214], [606, 138]];
const YOU_I = 5;
function smoothPath(pts) {
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]} ${p2[1]}`;
  }
  return d;
}
function contour(cx, cy, r, ph) {
  let d = "";
  for (let i = 0; i <= 48; i++) {
    const a = (i / 48) * Math.PI * 2;
    const rr = r * (1 + 0.16 * Math.sin(3 * a + ph) + 0.07 * Math.sin(5 * a + ph * 2));
    d += (i ? " L" : "M") + (cx + Math.cos(a) * rr * 1.25).toFixed(1) + " " + (cy + Math.sin(a) * rr).toFixed(1);
  }
  return d + "Z";
}
function mapSvg() {
  const hills = [[640, 110, 9, 0.4], [150, 260, 5, 1.7], [700, 640, 5, 2.6]];
  let contours = "";
  hills.forEach(([cx, cy, n, ph]) => { for (let k = n; k >= 1; k--) contours += `<path d="${contour(cx, cy, k * 52, ph + k * 0.08)}" fill="${k % 2 ? "#E3EADB" : "#E9EEE4"}" stroke="${k % 5 === 0 ? "#B9C4AE" : "#CDD6C3"}" stroke-width="${k % 5 === 0 ? 1.6 : 1}"/>`; });
  const trail = smoothPath(MAP_PTS), walked = smoothPath(MAP_PTS.slice(0, YOU_I + 1));
  const [ux, uy] = MAP_PTS[YOU_I];
  const offX = S.offTrail ? ux + 52 : ux, offY = S.offTrail ? uy + 14 : uy;
  const marker = (x, y, bg, ic, label, layer) => `<g data-layer="${layer}"><circle cx="${x}" cy="${y}" r="17" fill="${bg}" stroke="#fff" stroke-width="3"/><svg x="${x - 9}" y="${y - 9}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${ICONS[ic]}</svg>${label ? `<text x="${x + 24}" y="${y + 5}" font-size="17" font-weight="700" fill="#15302A" stroke="#F4F6F0" stroke-width="4" paint-order="stroke">${label}</text>` : ""}</g>`;
  return `<svg id="map-svg" width="800" height="1000" viewBox="0 0 800 1000" aria-label="Offline map of today's route">
    <rect width="800" height="1000" fill="#EEF2EA"/>
    <path d="M0 360 C120 330 200 420 300 400 C420 380 470 300 600 330 C700 350 760 420 800 400 L800 1000 L0 1000Z" fill="#DCE8D2" opacity=".7"/>
    ${contours}
    <path d="M60 1000 C140 900 260 640 420 600 C520 575 640 610 800 520" fill="none" stroke="#8DB8DA" stroke-width="5" stroke-linecap="round"/>

function mapControls(wrap) {
  const svg = wrap.querySelector("#map-svg");
  const [ux, uy] = MAP_PTS[YOU_I];
  let s = 0.85, tx = 0, ty = 0;
  const apply = () => { svg.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`; };
  const center = () => { const r = wrap.getBoundingClientRect(); tx = r.width / 2 - ux * s; ty = r.height * 0.45 - uy * s; apply(); };
  svg.style.left = "0"; svg.style.top = "0";
  center();
  let drag = null;
  wrap.addEventListener("pointerdown", (e) => { if (e.target.closest("button")) return; drag = { x: e.clientX, y: e.clientY, tx, ty }; wrap.setPointerCapture(e.pointerId); });
  wrap.addEventListener("pointermove", (e) => { if (!drag) return; tx = drag.tx + e.clientX - drag.x; ty = drag.ty + e.clientY - drag.y; apply(); });
  wrap.addEventListener("pointerup", () => { drag = null; });
  wrap.addEventListener("pointercancel", () => { drag = null; });
  wrap.__zoom = (z) => {
    const r = wrap.getBoundingClientRect(), cx = r.width / 2, cy = r.height / 2;
    const ns = Math.min(2.4, Math.max(0.5, s * z));
    tx = cx - ((cx - tx) / s) * ns; ty = cy - ((cy - ty) / s) * ns; s = ns;
    svg.style.transition = "transform .2s"; apply(); setTimeout(() => (svg.style.transition = ""), 220);
  };
  wrap.__center = () => { svg.style.transition = "transform .25s"; center(); setTimeout(() => (svg.style.transition = ""), 260); };
}

function lookView(mode, standalone) {
  const tabs = `<div class="seg" role="group" aria-label="Look">${[["peaks", "Peaks"], ["birds", "Birds"], ["around", "Around me"]].map(([k, l]) => `<button data-act="look-mode" data-k="${k}" aria-pressed="${k === mode}">${l}</button>`).join("")}</div>`;

      <div class="look-sheet"><div class="hstack between"><div class="stack"><span class="h2" id="peak-name">Trishul</span><span class="small muted" id="peak-meta">7,120 m · 23,360 ft · 26 km away</span></div><button class="btn secondary sm" data-act="save-photo">${icon("share", "sm")}Save</button></div>

  } else if (mode === "birds") {
    body = `<div class="stack gap16" style="flex:1;align-items:center;justify-content:center;padding:20px" id="birds">

        <div class="stack gap10" id="bird-results" style="width:100%" hidden></div>
      </div>`;
  } else {
    const items = [["camp", "Tilandi camp", "1.9 km · about 3 h 10 min"], ["water", "Small stream", "about 40 min · treat before drinking"], ["climb", "Ridge top", "about 1 h 20 min · steep"], ["look", "Brahmatal lake", "Day 4 · 6 km"], ["signal", "Last network", "Behind you, at Lohajung"]];
    body = `<div class="scroll" style="padding:4px 16px 16px"><div class="list">${items.map(([ic, t, s]) => `<div class="row"><span class="tile ${ic === "water" ? "water" : ""}">${icon(ic)}</span><span class="grow"><span class="t">${t}</span><span class="s">${s}</span></span></div>`).join("")}</div></div>`;
  }
  return {
    title: "Look", cls: "dark", theme: "#13302A",
    html: `<div class="stack" style="flex:1;min-height:0;background:#13302A;position:relative">${head}${body}</div>${standalone ? "" : trailbar("look")}`,
    mount(el) {
      const pano = el.querySelector("#pano");
      if (pano) {
        const name = el.querySelector("#peak-name"), meta = el.querySelector("#peak-meta"), svg = pano.querySelector("svg");
        const scale = () => svg.getBoundingClientRect().height / 620;
        pano.scrollLeft = 1010 * scale() - pano.clientWidth / 2;
        const update = () => {
          const mid = (pano.scrollLeft + pano.clientWidth / 2) / scale();
          const p = PANO_PEAKS.reduce((a, b) => (Math.abs(b.x - mid) < Math.abs(a.x - mid) ? b : a));
          name.textContent = p.name;
          meta.textContent = `${p.m.toLocaleString("en-IN")} m · ${Math.round(p.m * 3.281).toLocaleString("en-IN")} ft · ${p.km} km away`;
        };
        pano.addEventListener("scroll", update, { passive: true });
        let dx = null;
        pano.addEventListener("pointerdown", (e) => { if (e.pointerType === "mouse") { dx = { x: e.clientX, s: pano.scrollLeft }; pano.setPointerCapture(e.pointerId); } });
        pano.addEventListener("pointermove", (e) => { if (dx) pano.scrollLeft = dx.s - (e.clientX - dx.x); });
        pano.addEventListener("pointerup", () => { dx = null; });
        update();
      }
    },
  };
}

function panoSvg() {
  // A camera view at dawn: snow peaks, a hazy middle ridge, dark forest in front.
  const W = 1500, H = 620, base = 380;
  const peakTop = (p) => base - 30 - p.h * 190;
  let far = `M0 ${H} L0 ${base - 20}`;
  for (let x = 0; x <= W; x += 12) {
    let y = base - 20 - 22 * Math.sin(x / 90) - 9 * Math.sin(x / 27) - 4 * Math.sin(x / 9);
    PANO_PEAKS.forEach((p) => { const d = Math.abs(x - p.x); if (d < 190) y = Math.min(y, peakTop(p) + (base - 20 - peakTop(p)) * (d / 190) ** 0.8 + 6 * Math.sin(x / 7)); });
    far += ` L${x} ${y.toFixed(1)}`;
  }
  far += ` L${W} ${H}Z`;
  const band = (b, a1, f1, a2, f2) => { let d = `M0 ${H} L0 ${b}`; for (let x = 0; x <= W; x += 16) d += ` L${x} ${(b - a1 * Math.abs(Math.sin(x / f1)) - a2 * Math.sin(x / f2)).toFixed(1)}`; return d + ` L${W} ${H}Z`; };
  const labels = PANO_PEAKS.map((p) => { const top = peakTop(p), w = p.name.length * 9.5 + 28; return `<g><line x1="${p.x}" y1="${top - 6}" x2="${p.x}" y2="${top - 46}" stroke="#fff" stroke-width="1.5" opacity=".9"/><rect x="${p.x - w / 2}" y="${top - 80}" width="${w}" height="34" rx="17" fill="rgba(255,255,255,.95)"/><text x="${p.x}" y="${top - 57}" text-anchor="middle" font-family="Figtree, sans-serif" font-size="16" font-weight="700" fill="#15302A">${p.name}</text></g>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" preserveAspectRatio="xMinYMid meet" aria-label="Camera view with peak names">
    <defs><linearGradient id="psky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F5878"/><stop offset=".55" stop-color="#8FB0C4"/><stop offset=".8" stop-color="#E7C9A4"/></linearGradient>
    <linearGradient id="psnow" x1="0" y1="0" x2="0" y2="1"><stop offset=".15" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#E4ECF0"/><stop offset=".75" stop-color="#9DB3C0"/></linearGradient>
    <linearGradient id="phaze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7E98A6"/><stop offset="1" stop-color="#5D7A80"/></linearGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#psky)"/>
    <path d="${far}" fill="url(#psnow)"/>
    <path d="${band(base + 40, 26, 160, 10, 47)}" fill="url(#phaze)" opacity=".9"/>
    <path d="${band(base + 95, 34, 120, 12, 37)}" fill="#35574A"/>
    <path d="${band(base + 150, 22, 90, 8, 23)}" fill="#1F3D33"/>
    ${labels}
  </svg>`;
}

function qrSvg() {
  let seed = 4827, cells = "";
  const rand = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#15302A"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#15302A"/>`;
  for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
    const inFinder = (x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16);
    if (!inFinder && rand() > 0.52) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="0 0 25 25" width="100%" height="100%" shape-rendering="crispEdges" aria-label="Join code"><g fill="#15302A">${cells}</g>${finder(0, 0)}${finder(18, 0)}${finder(0, 18)}</svg>`;
}

function amsStep(el, i, answers) {
  const body = el.querySelector("#ams"), foot = el.querySelector("#ams-foot");
  body.scrollTop = 0;
  const total = AMS_QUESTIONS.length + 1;
  const dots = `<div class="step-dots">${Array.from({ length: total }, (_, k) => `<span class="${k <= i ? "on" : ""}"></span>`).join("")}</div>`;
  if (i < AMS_QUESTIONS.length) {
    const q = AMS_QUESTIONS[i];
    let pick = answers[i] ?? null;
    body.innerHTML = `<div class="pad stack gap20 enter-push" style="padding-top:4px">${dots}<div class="stack gap6"><span class="eyebrow">Question ${i + 1} of ${total}</span><h1 class="h1">${q.q}</h1></div>
      <div class="q-opts" role="radiogroup">${q.opts.map((o, k) => `<button class="choice" role="radio" aria-checked="${pick === k}" data-k="${k}"><span class="radio"></span><span class="h3" style="font-weight:${pick === k ? 700 : 400}">${o}</span></button>`).join("")}</div></div>`;
    foot.innerHTML = `<button class="btn primary block" id="ams-next" ${pick == null ? "disabled" : ""}>Next</button>`;
    body.querySelectorAll(".choice").forEach((b) => b.addEventListener("click", () => {
      pick = +b.dataset.k; buzz();
      body.querySelectorAll(".choice").forEach((x) => { const on = +x.dataset.k === pick; x.setAttribute("aria-checked", on); x.querySelector(".h3").style.fontWeight = on ? 700 : 400; });
      foot.querySelector("#ams-next").disabled = false;
    }));
    foot.querySelector("#ams-next").onclick = () => { answers[i] = pick; amsStep(el, i + 1, answers); };
  } else if (i === AMS_QUESTIONS.length) {
    const flags = new Set(answers.flags || []);
    body.innerHTML = `<div class="pad stack gap20 enter-push" style="padding-top:4px">${dots}<div class="stack gap6"><span class="eyebrow">Last question</span><h1 class="h1">Is any of this happening right now?</h1><p class="muted">Tick all that apply.</p></div>
      <div class="q-opts">${AMS_WARNINGS.map((w, k) => `<button class="choice" role="checkbox" aria-checked="${flags.has(k)}" data-k="${k}"><span class="check ${flags.has(k) ? "on" : ""}">${icon("check", "sm", 3)}</span><span class="h3">${w}</span></button>`).join("")}</div></div>`;
    foot.innerHTML = `<button class="btn primary block" id="ams-next">See my result</button>`;
    body.querySelectorAll(".choice").forEach((b) => b.addEventListener("click", () => {
      const k = +b.dataset.k; flags.has(k) ? flags.delete(k) : flags.add(k); buzz();
      b.setAttribute("aria-checked", flags.has(k)); b.querySelector(".check").classList.toggle("on", flags.has(k));
    }));
    foot.querySelector("#ams-next").onclick = () => { answers.flags = [...flags]; amsStep(el, i + 1, answers); };
  } else {
    const score = answers.slice(0, 4).reduce((a, b) => a + b, 0);
    const serious = (answers.flags || []).length > 0 || score >= 6 || answers.slice(0, 4).includes(3);
    const mild = !serious && score >= 3;
    const r = serious
      ? { cls: "serious", title: "This is serious. Go down now.", text: "Don't go alone. Tell your trek leader straight away. Going down is the right call." }
      : mild
        ? { cls: "mild", title: "These can be early signs of altitude sickness", text: "Tell your trek leader now. Don't climb higher today. Rest and drink water." }
        : { cls: "fine", title: "You're doing fine", text: answers[0] > 0 ? "A light headache is common up high. Keep sipping water, keep the pace easy, and check again in an hour." : "Keep sipping water and keep the pace easy." };
    if (serious) buzz([60, 60, 60]);
    body.innerHTML = `<div class="pad stack gap16 enter-push" style="padding-top:4px"><div class="result ${r.cls}"><span class="tile ${serious ? "" : mild ? "amber" : "ok"}" style="${serious ? "background:rgba(255,255,255,.18);color:#fff" : ""}">${icon(serious ? "sos" : mild ? "info" : "check")}</span><h1 class="h1" style="font-size:30px">${r.title}</h1><p style="font-size:17px">${r.text}</p></div>
      <p class="small muted">This is a self-check, not a diagnosis. It's based on the Lake Louise score that trek leaders use.</p></div>`;
    foot.innerHTML = serious
      ? `<button class="btn danger block" data-go="sos">Open SOS</button><button class="btn secondary block" data-act="tell-leader">Tell my trek leader</button>`
      : mild
        ? `<button class="btn primary block" data-act="remind-ams">Remind me to check in 1 hour</button><button class="btn ghost block" data-act="ams-again">Check again</button>`

function openCheck(id) {
  const c = CHECKS.find((x) => x.id === id);
  const done = !!S.checks[id];
  const toggleBtn = `<button class="btn ${done ? "secondary" : "primary"} block" data-act="toggle-check" data-id="${id}">${done ? "Mark as not done" : "Mark as done"}</button>`;
  const bodies = {
    fitness: `<p>${BRAHMATAL.fitness.target}.</p><div class="progress"><i style="width:62%"></i></div><p class="small muted">${BRAHMATAL.fitness.best} <span class="sample-tag">sample</span>. ${BRAHMATAL.fitness.weeks}.</p>`,
    travel: `<div class="list">${[["26 Nov", "Reach Rishikesh. Stay near the bus stand."], ["27 Nov, 5 am", "Bus to Lohajung, about 12 h"], ["2 Dec", "Back in Rishikesh by evening"], ["3 Dec", "Buffer day. Book your train or flight for today or later."]].map(([a, b]) => `<div class="row"><span class="grow"><span class="t">${a}</span><span class="s">${b}</span></span></div>`).join("")}</div>`,
    permits: `<ul class="bullets"><li>Forest permit at Lohajung. Your trek company usually arranges it.</li><li>Carry a photo ID (Aadhaar, passport or driving licence) and 2 photocopies.</li><li>Medical certificate from a doctor, if your trek company asks for one.</li></ul><p class="source">${BRAHMATAL.permits.source}</p>`,
    offline: `<ol class="bullets"><li>Turn on airplane mode.</li><li>Close Mt. Aryse and open it again.</li><li>Open Brahmatal and check the map and today's plan load.</li></ol><p class="small muted">If it all opens, you're ready for no network.</p>`,
  };
  if (id === "packing") return packingSheet();
  if (id === "contacts") return contactsSheet(() => { if (S.contacts.length) S.checks.contacts = true; save(); render(); });
  sheet(`<div class="hstack gap12"><span class="tile">${icon(c.icon)}</span><h2 class="h2">${c.title}</h2></div>${bodies[id] || ""}${toggleBtn}`);
}
ACTIONS["toggle-check"] = (el) => { S.checks[el.dataset.id] = !S.checks[el.dataset.id]; save(); buzz(); closeSheet(true); render(); if (S.checks[el.dataset.id]) toast("Done. One less thing to think about."); };

function packingSheet() {
  const all = PACKING.flatMap((g) => g.items);
  const count = () => all.filter((i) => S.packing[i]).length;
  sheet(`<div class="hstack between"><h2 class="h2">Packing list</h2><span class="small muted" id="pack-count">${count()} of ${all.length}</span></div><p class="muted">For Brahmatal in November.</p>
    ${PACKING.map((g) => `<div class="stack gap8"><span class="eyebrow">${g.group}</span><div class="list">${g.items.map((i) => `<button class="row" data-item="${esc(i)}" style="min-height:54px"><span class="check ${S.packing[i] ? "on" : ""}">${icon("check", "sm", 3)}</span><span class="grow"><span class="t" style="font-weight:400">${i}</span></span></button>`).join("")}</div></div>`).join("")}
    <button class="btn primary block" data-act="close-sheet">Done</button>`, (sh) => {
    sh.querySelectorAll("[data-item]").forEach((b) => b.addEventListener("click", () => {
      const i = b.dataset.item; S.packing[i] = !S.packing[i]; buzz();
      b.querySelector(".check").classList.toggle("on", S.packing[i]);
      sh.querySelector("#pack-count").textContent = `${count()} of ${all.length}`;
      S.checks.packing = count() === all.length; save();
    }));
    return () => { if (current && current.name === "prepare") setTimeout(render, 230); };
  });
}

function contactsSheet(after) {

    <div class="list" id="c-list">${S.contacts.map((c) => `<div class="row"><span class="grow"><span class="t">${esc(c.name)}</span><span class="s">${esc(c.phone)}</span></span></div>`).join("") || '<div class="row"><span class="s">No contacts yet</span></div>'}</div>
    <label class="field">Name<input id="c-name" autocomplete="off" placeholder="Maa"></label>
    <label class="field">Phone number<input id="c-phone" type="tel" inputmode="tel" autocomplete="off" placeholder="98765 43210"></label>
    <button class="btn primary block" id="c-add">Add contact</button>`, (sh) => {
    sh.querySelector("#c-add").addEventListener("click", () => {
      const name = sh.querySelector("#c-name").value.trim(), phone = sh.querySelector("#c-phone").value.trim();

    <div class="stack gap8"><span class="field" style="margin:0">How easy was it to use?</span><div class="stars" role="group">${[1, 2, 3, 4, 5].map((n) => `<button data-r="${n}" aria-pressed="false" aria-label="${n} out of 5">${n}</button>`).join("")}</div><div class="hstack between small muted"><span>Confusing</span><span>Very easy</span></div></div>
    <div class="stack gap8"><span class="field" style="margin:0">You are a</span><div class="hstack gap8">${["Trek leader", "Trekker", "Both"].map((w) => `<button class="filter" data-w="${w}" aria-pressed="false">${w}</button>`).join("")}</div></div>
    <label class="field">What confused you, or what's missing?<textarea id="fb-txt" placeholder="The time to camp felt…"></textarea></label>
    <label class="field">Your name (optional)<input id="fb-name" autocomplete="name"></label>
    <button class="btn primary block" id="fb-send">${icon("chat", "sm")}Send on WhatsApp</button>
    <button class="btn ghost block" id="fb-copy">Copy as text instead</button>`, (sh) => {
    sh.querySelectorAll("[data-r]").forEach((b) => b.addEventListener("click", () => { rating = +b.dataset.r; buzz(); sh.querySelectorAll("[data-r]").forEach((x) => x.setAttribute("aria-pressed", x === b)); }));
    sh.querySelectorAll("[data-w]").forEach((b) => b.addEventListener("click", () => { who = b.dataset.w; sh.querySelectorAll("[data-w]").forEach((x) => x.setAttribute("aria-pressed", x === b)); }));
    const compose = () => {
      const name = sh.querySelector("#fb-name").value.trim(), txt = sh.querySelector("#fb-txt").value.trim();
      const seen = S.visited.filter((v) => !["install"].includes(v)).join(", ");
      return `Mt. Aryse feedback${name ? ` from ${name}` : ""}\nEase of use: ${rating ? rating + "/5" : "not rated"}\nRole: ${who || "not said"}\n\n${txt || "(no comments)"}\n\nScreens tried: ${seen}\nPhone: ${navigator.userAgent.match(/\(([^)]+)\)/)?.[1] || "unknown"}`;
    };
    sh.querySelector("#fb-send").addEventListener("click", () => { window.open("https://wa.me/919898667761?text=" + encodeURIComponent(compose()), "_blank"); closeSheet(); toast("Thank you. This really helps."); });
    sh.querySelector("#fb-copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(compose()); toast("Copied. Paste it in any chat."); } catch (e) { toast("Couldn't copy on this phone", "info"); }
    });
  });
}

/* ---------- wiring ---------- */

document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-act]");
  if (a && !a.disabled) { e.preventDefault(); const fn = ACTIONS[a.dataset.act]; if (fn) fn(a, e); return; }
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled) { e.preventDefault(); go(g.dataset.go, { replace: !!g.dataset.replace }); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
window.addEventListener("hashchange", render);
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault(); window.__installPrompt = e;
  const b = document.getElementById("install-btn"); if (b) VIEWS.install().mount();
});
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(() => {});

if (!location.hash) go(homeRoute(), { replace: true }); else render();
</script>
