<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onboarding 1 · Welcome · Mt. Aryse prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
html,body{margin:0;background:#DDE4E0}
a{color:#1E4D40}a:hover{color:#123329}
.frame{width:390px;margin:0 auto;transform-origin:top center}
.proto-home{position:fixed;right:10px;bottom:10px;z-index:9;padding:8px 12px;border-radius:999px;background:rgba(21,48,42,.85);color:#fff;font:700 13px system-ui;text-decoration:none}
</style>

<body>
<div class="frame" id="frame">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1E4D40; color: #FFFFFF; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column; padding: 28px 24px 32px; gap: 18px">
  <span style="font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.02em">Mt. Aryse</span>

  <svg width="342" height="280" viewBox="0 0 342 280" aria-hidden="true">
    <path d="M0 230 L70 130 L105 165 L170 60 L225 140 L260 110 L342 200 L342 280 L0 280 Z" fill="#2E6656"/>
    <path d="M170 60 L195 98 L182 94 L170 110 L156 90 Z" fill="#E9EFF1"/>
    <path d="M30 262 C80 240 120 236 150 210 C175 188 190 160 210 150" fill="none" stroke="#E8A33D" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
    <circle cx="210" cy="150" r="9" fill="#E8A33D" stroke="#1E4D40" stroke-width="3"/>
  </svg>

  <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', sans-serif; font-weight: 700; font-size: 40px; line-height: 1.08">Your trek mate, even with no network</h1>

    <li>How long to camp, and where the next water is</li>
    <li>Day-by-day plans for India's treks</li>
    <li>The names of the peaks around you</li>
  </ul>

  <div style="flex: 1"></div>

  <a href="onbexperience.html" style="min-height: 56px; border-radius: 18px; background: #E8A33D; color: #2A1A02; font-size: 18px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Get started</a>
  <span style="text-align: center; font-size: 15px; color: #BFD8CE">Free during early access. No account needed.</span>
</div>
</div>
<a class="proto-home" href="index.html">All screens</a>
<script>
// fit the 390 px design to narrower phones
function fit(){var s=Math.min(1,window.innerWidth/390),f=document.getElementById('frame');f.style.transform='scale('+s+')';f.style.height=(f.scrollHeight*s)+'px';}
window.addEventListener('resize',fit);fit();

</script>
