<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onboarding 2 · Experience · Mt. Aryse prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
html,body{margin:0;background:#DDE4E0}
a{color:#1E4D40}a:hover{color:#123329}
.frame{width:390px;margin:0 auto;transform-origin:top center}
.proto-home{position:fixed;right:10px;bottom:10px;z-index:9;padding:8px 12px;border-radius:999px;background:rgba(21,48,42,.85);color:#fff;font:700 13px system-ui;text-decoration:none}
</style>
</head>
<body>
<div class="frame" id="frame">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F5F3; color: #15302A; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column; padding: 24px 20px 32px; gap: 20px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="onbwelcome.html" aria-label="Back" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #C9D5D0; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15302A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <span style="font-size: 15px; color: #4B6560">1 of 2</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.1">Have you trekked in the Himalayas before?</h1>
    <p style="margin: 0; font-size: 17px; color: #4B6560">We'll explain more or less depending on your answer. You can change this later.</p>
  </div>
  <div role="radiogroup" aria-label="Trekking experience" id="opts" style="display: flex; flex-direction: column; gap: 12px"></div>
  <div style="flex: 1"></div>
  <a href="onblocation.html" style="min-height: 56px; border-radius: 18px; background: #1E4D40; color: #FFFFFF; font-size: 18px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Continue</a>
</div>
</div>
<a class="proto-home" href="index.html">All screens</a>
<script>
// fit the 390 px design to narrower phones
function fit(){var s=Math.min(1,window.innerWidth/390),f=document.getElementById('frame');f.style.transform='scale('+s+')';f.style.height=(f.scrollHeight*s)+'px';}
window.addEventListener('resize',fit);fit();
var items = [
  ["This will be my first", "We'll walk you through everything, step by step"],
  ["I've done one or two", "Tips when they matter, less hand-holding"],
  ["I've done lots", "Just the map, the numbers and the trail"]
];
var picked = 0, box = document.getElementById('opts');
function render() {
  box.innerHTML = '';
  items.forEach(function (it, i) {
    var on = i === picked, b = document.createElement('button');
    b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', on);
    b.style.cssText = 'display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:18px;border-radius:18px;font-family:inherit;color:#15302A;text-align:left;cursor:pointer;' + (on ? 'background:#E7F1EC;border:2px solid #1E4D40' : 'background:#FFFFFF;border:1px solid #DCE5E1');
    b.innerHTML = '<span style="font-size:19px;font-weight:700"></span><span style="font-size:15px;color:#4B6560"></span>';
    b.children[0].textContent = it[0]; b.children[1].textContent = it[1];
    b.onclick = function () { picked = i; render(); };
    box.appendChild(b);
  });
}
render();
</script>
</body>
</html>
